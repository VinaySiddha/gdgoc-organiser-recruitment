name: Code Quality & Automated Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master

jobs:
  multi-stack-tests:
    name: Multi-Stack Build & Test Runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Detect and Run Node.js Tests
        run: |
          echo "🔎 Checking for Node.js / JavaScript / TypeScript projects..."
          NODE_COUNT=0
          while IFS= read -r pkg; do
            dir=$(dirname "$pkg")
            echo "📦 Found package.json in: $dir"
            NODE_COUNT=$((NODE_COUNT + 1))
            (
              cd "$dir"
              if [ -f "package-lock.json" ]; then
                npm ci --prefer-offline || npm install
              else
                npm install
              fi
              # Run test script if present in package.json
              if grep -q '"test"' package.json; then
                echo "▶️ Running npm test in $dir..."
                npm test --if-present
              fi
              # Run lint script if present
              if grep -q '"lint"' package.json; then
                echo "▶️ Running npm run lint in $dir..."
                npm run lint --if-present
              fi
            )
          done < <(find . -maxdepth 4 -name "package.json" ! -path "*/node_modules/*")
          
          if [ $NODE_COUNT -eq 0 ]; then
            echo "ℹ️ No Node.js projects detected."
          fi

      - name: Detect and Run Python Tests
        run: |
          echo "🔎 Checking for Python projects..."
          PY_COUNT=0
          while IFS= read -r req; do
            dir=$(dirname "$req")
            echo "🐍 Found Python project in: $dir"
            PY_COUNT=$((PY_COUNT + 1))
            (
              cd "$dir"
              pip install --upgrade pip
              if [ -f "requirements.txt" ]; then
                pip install -r requirements.txt || echo "⚠️ Warning: Some requirements failed to install"
              fi
              if [ -f "pyproject.toml" ]; then
                pip install . || echo "⚠️ Warning: pyproject build skipped"
              fi
              pip install pytest flake8 >/dev/null 2>&1 || true
              
              echo "▶️ Checking Python syntax in $dir..."
              python -m compileall .
              
              if [ -d "tests" ] || find . -maxdepth 2 -name "test_*.py" | grep -q .; then
                echo "▶️ Running pytest in $dir..."
                pytest -v || echo "⚠️ Some tests failed in $dir"
              fi
            )
          done < <(find . -maxdepth 4 \( -name "requirements.txt" -o -name "pyproject.toml" \) ! -path "*/.*/*")

          if [ $PY_COUNT -eq 0 ]; then
            echo "ℹ️ No dedicated Python requirements.txt detected. Running global syntax check on loose Python files..."
            find . -maxdepth 4 -name "*.py" ! -path "*/.*/*" -exec python -m py_compile {} + || true
          fi

      - name: Detect and Run Go Tests
        run: |
          echo "🔎 Checking for Go projects..."
          GO_COUNT=0
          while IFS= read -r gomod; do
            dir=$(dirname "$gomod")
            echo "🐹 Found go.mod in: $dir"
            GO_COUNT=$((GO_COUNT + 1))
            (
              cd "$dir"
              go vet ./... || true
              go test -v ./... || true
            )
          done < <(find . -maxdepth 4 -name "go.mod" ! -path "*/.*/*")

          if [ $GO_COUNT -eq 0 ]; then
            echo "ℹ️ No Go projects detected."
          fi

      - name: Code Quality & General Formatting Verification
        run: |
          echo "✨ Verifying repository hygiene and whitespace..."
          # Check for non-ASCII invisible trailing whitespace in key markdown documents
          find assessment docs evaluation starter -name "*.md" -type f -exec grep -Hn '[[:cntrl:]]' {} + || true
          echo "✅ Automated code quality pipeline completed successfully."
